  <g id="text_23">
   <text style="font-weight: 700; font-size: 16.5px; font-family: 'Inter Display'; text-anchor: start; fill: #1a1a1a" x="8.2944" y="28.886775" transform="rotate(-0 8.2944 28.886775)">WingCLIP-0.3 is the fastest, and beats its own teacher</text>
  </g>
  <g id="text_24">
   <text style="font-size: 10.5px; font-family: 'Inter'; text-anchor: start; fill: #6b6862" x="8.2944" y="52.565475" transform="rotate(-0 8.2944 52.565475)">NABirds top-1 over 11,167 species against latency; bubble area is model size</text>
  </g>
  <g id="text_25">
   <text style="font-size: 8.5px; font-family: 'Inter'; fill: #918e88" transform="translate(8.2944 431.535082)">Forward pass at batch 1 on an RTX 3080, fp32, synthetic batches so no image loading is timed. Left is faster, up is more accurate, smaller</text>
   <text style="font-size: 8.5px; font-family: 'Inter'; fill: #918e88" transform="translate(8.2944 446.44785)">is lighter.  EVA02 iNat21 is supervised over a fixed 10,000-class head, not open-vocabulary.</text>
  </g>
