<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1320">
  <title>WingDex - polished App Store artwork</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1320px; height: 2868px; }
    body { color: #173d2c; font-family: Arial, sans-serif; }
    .artwork {
      position: relative;
      isolation: isolate;
      width: 1320px;
      height: 2868px;
      overflow: hidden;
      background: #f5efdf;
      --phone-width: 974px;
      --paired-scale: .67;
      --phone-top: 718px;
    }
    .artwork::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 1800px;
      height: 2100px;
      left: -240px;
      top: 1070px;
      border-radius: 50% 50% 0 0;
      background: #dce5d6;
    }
    h1 {
      position: absolute;
      left: 104px;
      top: 110px;
      margin: 0;
      font: 138px / 1.04 Georgia, serif;
      letter-spacing: -6.5px;
      font-weight: 400;
    }
    h1 span { display: block; white-space: nowrap; }
    .support {
      position: absolute;
      left: 108px;
      top: 487px;
      margin: 0;
      font: 46px / 1.3 Arial, sans-serif;
      letter-spacing: -.9px;
      color: #425b45;
    }
    .device {
      position: absolute;
      top: var(--phone-top);
      left: 173px;
      width: var(--phone-width);
      padding: 16px;
      border: 1px solid #747c74;
      border-radius: 132px;
      background: #192019;
      box-shadow: inset 0 0 0 3px #424a42, inset 0 0 0 6px #080c08,
        0 45px 80px -25px #173d2c45, 0 8px 15px #173d2c14;
      transform-origin: top left;
    }
    .device img { display: block; width: 940px; height: auto; border-radius: 116px; }
    .island {
      position: absolute;
      top: 45px;
      left: 50%;
      transform: translateX(-50%);
      width: 284px;
      height: 78px;
      border-radius: 46px;
      background: #050705;
    }
    .island::after {
      content: "";
      position: absolute;
      right: 26px;
      top: 25px;
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background: radial-gradient(circle at 60% 40%, #172321, #090d0b 60%);
    }
    .side-button { position: absolute; width: 6px; background: #424a42; border-radius: 3px; }
    .volume-up { left: -6px; top: 304px; height: 117px; }
    .volume-down { left: -6px; top: 457px; height: 117px; }
    .power { right: -6px; top: 432px; height: 175px; }
    .paired .device { transform: scale(var(--paired-scale)); }
    .paired .device.first { left: 24px; }
    .paired .device.second { left: 644px; top: 1340px; }
    .caption {
      position: absolute;
      margin: 0;
      font: 42px / 1.25 Arial, sans-serif;
      letter-spacing: -.5px;
      color: #425b45;
    }
    .caption.first { left: 62px; top: 636px; }
    .caption.second { left: 708px; top: 1258px; }
    .photos {
      position: absolute;
      top: 487px;
      left: 112px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .photo {
      width: 208px;
      height: 181px;
      margin: 0;
      padding: 9px 9px 28px;
      border-radius: 9px;
      background: #fffdf7;
      box-shadow: 0 10px 20px #25462a14, 0 2px 4px #25462a0b;
    }
    .photo img { width: 190px; height: 144px; object-fit: cover; border-radius: 3px; }
    .photo:nth-child(1) { transform: translateY(2px) rotate(-6deg); }
    .photo:nth-child(2) { transform: translateY(-10px) rotate(-3deg); }
    .photo:nth-child(3) { transform: translateY(-14px) rotate(1deg); }
    .photo:nth-child(4) { transform: translateY(-8px) rotate(3deg); }
    .photo:nth-child(5) { transform: translateY(4px) rotate(6deg); }
    .benefits { position: absolute; display: flex; gap: 20px; left: 108px; top: 487px; }
    .benefit {
      display: flex;
      align-items: center;
      gap: 15px;
      border: 1px solid #173d2c30;
      border-radius: 40px;
      padding: 17px 25px;
      background: #e5ebdd;
      font-size: 33px;
      letter-spacing: -.5px;
    }
    .benefit svg { width: 35px; height: 35px; fill: none; stroke: currentColor; stroke-width: 1.7; }
    .footnote {
      position: absolute;
      bottom: 18px;
      left: 90px;
      width: 1140px;
      margin: 0;
      text-align: center;
      color: #425b45;
      font: 27px / 1.35 Arial, sans-serif;
    }
    .sentences h1 { font-size: 154px; letter-spacing: -7px; }
    .sentences .caption {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .sentences[data-slide="02"] .device.first { left: 40px; top: 655px; transform: scale(.565); }
    .sentences[data-slide="02"] .device.second { left: 455px; top: 1000px; transform: scale(.847); }
    .sentences[data-slide="02"] .caption.first { left: 68px; top: 590px; }
    .sentences[data-slide="02"] .caption.second { left: 694px; top: 928px; }
    .sentences[data-slide="04"] .support { top: 640px; }
    .sentences[data-slide="04"] .device.first { top: 825px; }
    .sentences[data-slide="04"] .caption.first { top: 758px; }
    .sentences[data-slide="04"] .caption.second { top: 1266px; }
    .sentences[data-slide="05"] .benefits { top: 585px; }
    .sentences.revision-2[data-slide="04"] .support { top: 487px; }
    .sentences.revision-2[data-slide="04"] .device.first { top: 660px; }
    .sentences.revision-2[data-slide="04"] .caption.first { top: 591px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="artwork">
    <h1 class="copy"><span></span><span></span></h1>
    <p class="support copy" hidden></p>
    <div class="photos" aria-label="Five photos used in the first import" hidden>
      <figure class="photo"><img src="photo-jay.jpg" alt="Azure-hooded Jay"></figure>
      <figure class="photo"><img src="photo-quetzal.jpg" alt="Resplendent Quetzal"></figure>
      <figure class="photo"><img src="photo-azure-crowned.jpg" alt="Azure-crowned Hummingbird"></figure>
      <figure class="photo"><img src="photo-scoter.jpg" alt="Surf Scoter"></figure>
      <figure class="photo"><img src="photo-night-heron.jpg" alt="Yellow-crowned Night Heron"></figure>
    </div>
    <div class="benefits copy" hidden>
      <div class="benefit">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 1v4m6-4v4M9 19v4m6-4v4M1 9h4m-4 6h4m14-6h4m-4 6h4"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
        On-device ID
      </div>
      <div class="benefit">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v3"/></svg>
        No photo uploads
      </div>
    </div>
    <p class="footnote copy" hidden>Reference images and place lookup may need internet</p>
  </main>
  <template id="phone">
    <div class="device">
      <img>
      <span class="island" aria-hidden="true"></span>
      <span class="side-button volume-up" aria-hidden="true"></span>
      <span class="side-button volume-down" aria-hidden="true"></span>
      <span class="side-button power" aria-hidden="true"></span>
    </div>
  </template>
  <script>
    const slides = {
      '01': {
        headline: ['Bird photos in', 'Life list out'],
        photos: true,
        screens: [{ src: 'raw-home-v3.png', alt: 'WingDex Home with five species across three distinct outing locations' }],
      },
      '02': {
        headline: ['Bring the', 'whole batch'],
        screens: [
          { src: 'raw-batch-picker-23.png', alt: 'iOS photo picker with 23 bird photos selected', caption: 'Select many at once' },
          { src: 'raw-batch-outing-review.png', alt: 'WingDex automatically groups the selection into three outings, with 19 photos at Montrose', caption: 'Auto-grouped outings' },
        ],
      },
      '03': {
        headline: ['Identify with', 'confidence'],
        screens: [{ src: 'raw-identification-montrose.png', alt: 'Nashville Warbler identification with the user photo, reference, 98 percent model confidence, and alternatives' }],
      },
      '04': {
        headline: ['Every bird', 'Every outing'],
        screens: [
          { src: 'raw-montrose-outing-detail.png', alt: 'Montrose outing with fifteen species and American Goldfinch in its bird list', caption: 'What you saw' },
          { src: 'raw-goldfinch-sighting-history-v2.png', alt: 'Updated American Goldfinch sighting history from the WingDex tab, linking to Union Bay and Montrose', caption: 'Where you saw it' },
        ],
      },
      '05': {
        headline: ['Bird ID', 'Even offline'],
        benefits: true,
        screens: [{ src: 'raw-private-identification.png', alt: 'On-device Violet Sabrewing identification with the original photo and reference comparison' }],
      },
      '06': {
        headline: ['Your life list', 'Ready to grow'],
        support: 'No account required',
        screens: [{ src: 'raw-wingdex-life-list.png', alt: 'The populated WingDex life list with species, sightings, dates, and outing counts' }],
      },
    };
    const params = new URLSearchParams(location.search);
    const direction = params.get('direction') || 'original';
    if (!['original', 'sentences'].includes(direction)) throw new Error(`Unknown copy direction: ${direction}`);
    const revision = params.get('revision') || '1';
    if (!['1', '2'].includes(revision)) throw new Error(`Unknown copy revision: ${revision}`);
    if (direction === 'sentences') {
      const copy = {
        '01': { headline: ['Bird photos in.', 'Life list out.'] },
        '02': { headline: ['Bring the', 'whole batch.'], support: 'Automatically grouped by time and place.' },
        '03': { headline: ['More than', 'a name.'], support: 'Compare photos, confidence, and alternatives.' },
        '04': { headline: ['Remember', 'every bird.', 'And where.'], support: 'Your birds and outings, connected.' },
        '05': { headline: ['Bird ID.', 'Even offline.'], support: 'Your photos stay on your device.' },
        '06': { headline: ['Your WingDex.', 'Ready to grow.'], support: 'No account required' },
      };
      for (const [id, values] of Object.entries(copy)) Object.assign(slides[id], values);
      slides['04'].screens[0].caption = 'THE BIRDS YOU SAW';
      slides['04'].screens[1].caption = 'WHERE YOU SAW THEM';
      if (revision === '2') {
        Object.assign(slides['03'], {
          headline: ['Identify with', 'confidence.'],
          support: 'Compare photos. Explore the alternatives.',
        });
        Object.assign(slides['04'], {
          headline: ['Birding history.', 'All connected.'],
          support: 'Birds and outings, linked both ways.',
        });
        slides['04'].screens[0].caption = 'BIRDS BY OUTING';
        slides['04'].screens[1].caption = 'OUTINGS BY BIRD';
      }
    }
    const id = params.get('slide') || '01';
    if (!Object.hasOwn(slides, id)) throw new Error(`Unknown screenshot: ${id}`);
    const slide = slides[id];
    const art = document.querySelector('.artwork');
    art.classList.add(slide.screens.length === 2 ? 'paired' : 'single');
    if (direction === 'sentences') art.classList.add('sentences');
    art.classList.add(`revision-${revision}`);
    art.dataset.slide = id;
    art.setAttribute('aria-label', `WingDex App Store screenshot ${id}`);
    document.title = `WingDex ${id} - ${slide.headline.join(' / ')}`;
    document.querySelector('h1').replaceChildren(...slide.headline.map(line => {
      const span = document.createElement('span');
      span.textContent = line;
      return span;
    }));
    if (slide.support) {
      const support = document.querySelector('.support');
      support.textContent = slide.support;
      support.hidden = false;
    }
    document.querySelector('.photos').hidden = !slide.photos;
    document.querySelector('.benefits').hidden = !slide.benefits;
    document.querySelector('.footnote').hidden = !slide.benefits;
    slide.screens.forEach((screen, i) => {
      const position = i === 0 ? 'first' : 'second';
      if (screen.caption) {
        const caption = document.createElement('p');
        caption.className = `caption copy ${position}`;
        caption.textContent = screen.caption;
        art.append(caption);
      }
      const phone = document.querySelector('#phone').content.firstElementChild.cloneNode(true);
      phone.classList.add(position);
      const image = phone.querySelector('img');
      image.src = screen.src;
      image.alt = screen.alt;
      art.append(phone);
    });
  </script>
</body>
</html>
