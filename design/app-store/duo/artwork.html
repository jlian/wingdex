<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WingDex - iPhone Duo screenshots</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5efdf; color: #173d2c; font-family: Arial, sans-serif; }
    .artwork { width: 2853px; height: 2007px; padding: 80px 120px; overflow: hidden; position: relative; isolation: isolate; }
    .artwork::before { content: ""; position: absolute; z-index: -1; background: #dce5d6; width: 3600px; height: 1800px; border-radius: 50%; top: 960px; left: -380px; }
    header { height: 250px; display: flex; align-items: flex-start; justify-content: space-between; gap: 70px; }
    h1 { margin: 0; font: 112px/1.1 Georgia, serif; letter-spacing: -4px; }
    p { margin: 22px 0 0; font-size: 36px; line-height: 1.3; color: #425b45; }
    .icon { width: 140px; height: 140px; flex: none; }
    .screen { width: 2300px; margin: 0 auto; padding: 36px; border: 4px solid #717370; border-radius: 166px; background: #111312; box-shadow: inset 0 0 0 3px #303330, 0 28px 55px -20px #00000045; }
    .screen img { display: block; width: 100%; border-radius: 126px; }
    .gallery { max-width: 1200px; margin: 0 auto; padding: 32px; }
    .gallery h1 { font-size: 44px; letter-spacing: -1px; }
    .gallery p { font-size: 18px; }
    .gallery figure { margin: 32px 0; }
    .gallery figure img { width: 100%; }
    .gallery a { color: inherit; }
    .gallery figcaption { margin-top: 8px; }
  </style>
</head>
<body>
  <script>
    const slides = [
      ['Bird photos in. Life list out.', 'Your birds and outings, together on the expanded display.', 'raw-home.png', 'overview'],
      ['Auto-grouped into outings.', 'Dates, locations, and place names from your photos.', 'raw-outing-review.png', 'outings'],
      ['Identify with confidence.', 'Compare your photo, reference images, and confidence scores.', 'raw-identification.png', 'confidence'],
      ['Every outing. All connected.', 'Browse your trips and see the birds you found.', 'raw-outings-detail.png', 'outing-detail'],
      ['A life list worth exploring.', 'Browse species, learn more, and revisit your sightings.', 'raw-life-list-sabrewing.png', 'life-list'],
    ]
    const index = Number(new URLSearchParams(location.search).get('slide'))
    if (new URLSearchParams(location.search).has('slide')) {
      const [title, subtitle, source] = slides[index]
      document.body.innerHTML = `<main class="artwork"><header><div><h1>${title}</h1><p>${subtitle}</p></div><img class="icon" src="../app-icon.png" alt="WingDex"></header><div class="screen"><img src="${source}" alt="WingDex on an unfolded iPhone Duo"></div></main>`
    } else {
      document.body.innerHTML = `<main class="gallery"><h1>WingDex on iPhone Duo</h1><p>Landscape, unfolded display. Each export is 2853 × 2007 pixels.</p>${slides.map(([title, , , name], i) => `<figure><a href="wingdex-duo-0${i + 1}-${name}.png"><img src="wingdex-duo-0${i + 1}-${name}.png" alt="${title}"></a><figcaption>${i + 1}. ${title}</figcaption></figure>`).join('')}</main>`
    }
  </script>
</body>
</html>
