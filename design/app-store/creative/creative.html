<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WingDex - App Store creative assets</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; overflow: hidden; background: #f5efdf; }
    body { color: #173d2c; font-family: Arial, sans-serif; }
    .stage { position: relative; overflow: hidden; background: #e9e1cc; }
    .row { position: absolute; left: 0; display: flex; will-change: transform; }
    .tile { flex: none; overflow: hidden; border-radius: calc(46px * var(--s)); background: #c9c2ad; }
    .tile img, .shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .panel {
      position: absolute; display: flex; align-items: center; gap: calc(80px * var(--s));
      padding: 0 calc(96px * var(--s)); border-radius: calc(84px * var(--s)); background: #f5efdf;
      box-shadow: 0 calc(40px * var(--s)) calc(90px * var(--s)) calc(-30px * var(--s)) #173d2c66;
    }
    .copy { flex: 1; min-width: 0; }
    .icon { display: block; width: calc(132px * var(--s)); height: calc(132px * var(--s)); margin: 0 0 calc(26px * var(--s)) calc(-10px * var(--s)); }
    h1 { margin: 0; font: 400 calc(128px * var(--s)) / 1.02 Georgia, serif; letter-spacing: calc(-4.5px * var(--s)); text-wrap: balance; }
    p { margin: calc(30px * var(--s)) 0 0; font-size: calc(40px * var(--s)); line-height: 1.3; color: #425b45; max-width: 18em; }
    .outing { position: relative; flex: none; width: calc(620px * var(--s)); height: calc(560px * var(--s)); }
    .group { position: absolute; inset: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: calc(16px * var(--s)); height: calc(420px * var(--s)); }
    .grid.three .shot:first-child { grid-column: span 2; }
    .shot { overflow: hidden; border-radius: calc(30px * var(--s)); background: #c9c2ad; }
    .place { margin-top: calc(26px * var(--s)); font: 400 calc(46px * var(--s)) / 1.1 Georgia, serif; letter-spacing: calc(-1px * var(--s)); white-space: nowrap; }
    .meta { margin-top: calc(10px * var(--s)); font-size: calc(32px * var(--s)); color: #425b45; }
    .meta b { color: #173d2c; }
  </style>
</head>
<body>
  <main class="stage"></main>
  <script>
    const formats = {
      header: { width: 3840, height: 1646, safe: [1098, 494, 1644, 658], scale: 1, tile: 380 },
      search: { width: 3840, height: 2560, safe: [836, 766, 2166, 1028], scale: 1.42, tile: 420 },
    }
    const photos = {
      sabrewing: ['A6702760', 45, 42, 1.25], quetzal: ['A6702740', 56, 54, 2.7],
      mountainGem: ['A6702656', 36, 42, 1.3], jay: ['A6702549', 62, 58, 1.2],
      whiteEared: ['DSC02236', 64, 38, 2.3], cowbird: ['DSC02159', 36, 52, 1.6],
      flycatcher: ['DSC02155', 57, 55, 1.6], azureCrowned: ['DSC02036', 46, 55, 1.6],
      sparkling: ['DSC01992', 36, 48, 1.4], nightHeron: ['DSC01267', 50, 40, 1.05],
      whimbrel: ['DSC01182', 46, 42, 1.5], scoter: ['DSC01167', 60, 74, 1.4],
      pelicans: ['DSC01140', 50, 48, 1.35],
    }
    // Outings and species match the restored demo library.
    const outings = [
      ['Biotopo Mario Dary Rivera', 'Aug 18, 2026', ['quetzal', 'sabrewing', 'jay', 'mountainGem']],
      ['Lake Atitl\u00e1n', 'Aug 15, 2026', ['whiteEared', 'flycatcher', 'cowbird']],
      ['Tijuana Slough NWR', 'Apr 5, 2026', ['pelicans', 'whimbrel', 'nightHeron', 'scoter']],
    ]
    const loopSeconds = 12
    const segment = loopSeconds / outings.length
    const order = Object.keys(photos)
    const params = new URLSearchParams(location.search)
    const format = formats[params.get('format')] || formats.header
    const s = format.scale
    const stage = document.querySelector('.stage')
    document.documentElement.style.setProperty('--s', s)
    Object.assign(stage.style, { width: `${format.width}px`, height: `${format.height}px` })

    const image = name => {
      const [file, x, y, zoom] = photos[name]
      return `<img src="photos/${file}.jpg" alt="" style="object-position:${x}% ${y}%;transform:scale(${zoom});transform-origin:${x}% ${y}%">`
    }

    const tile = format.tile
    const gap = Math.round(36 * s)
    const pitch = tile + gap
    const perRow = Math.ceil(format.width / pitch) + 2
    const firstRowTop = format.height / 2 - tile / 2 - Math.ceil((format.height / 2) / pitch) * pitch
    const rows = []
    for (let top = firstRowTop, index = 0; top < format.height; top += pitch, index++) {
      const row = document.createElement('div')
      row.className = 'row'
      Object.assign(row.style, { top: `${top}px`, gap: `${gap}px` })
      row.innerHTML = Array.from({ length: perRow }, (_, i) =>
        `<div class="tile" style="width:${tile}px;height:${tile}px">${image(order[(i + index * 5) % order.length])}</div>`).join('')
      stage.append(row)
      rows.push({ row, direction: index % 2 ? 1 : -1, stagger: (index * 0.37 % 1) * pitch })
    }

    const [safeX, safeY, safeW, safeH] = format.safe
    const pad = 48 * s
    const panel = document.createElement('section')
    panel.className = 'panel'
    Object.assign(panel.style, {
      left: `${safeX - pad}px`, top: `${safeY - pad}px`,
      width: `${safeW + pad * 2}px`, height: `${safeH + pad * 2}px`,
    })
    panel.innerHTML = `
      <div class="copy">
        <img class="icon" src="../app-icon.png" alt="WingDex">
        <h1>Bring the whole batch.</h1>
        <p>WingDex identifies the birds and sorts your photos into outings.</p>
      </div>
      <div class="outing">${outings.map(([place, date, birds]) => `
        <div class="group">
          <div class="grid ${birds.length === 3 ? 'three' : ''}">${birds.map(bird => `<div class="shot">${image(bird)}</div>`).join('')}</div>
          <div class="place">${place}</div>
          <div class="meta">${date} \u00b7 <b>${birds.length} species</b></div>
        </div>`).join('')}
      </div>`
    stage.append(panel)
    const groups = [...panel.querySelectorAll('.group')]

    const clamp = value => Math.min(1, Math.max(0, value))
    const ease = value => 1 - Math.pow(1 - clamp(value), 3)
    const easeIn = value => Math.pow(clamp(value), 2)

    window.render = time => {
      const t = ((time % loopSeconds) + loopSeconds) % loopSeconds
      for (const { row, direction, stagger } of rows) {
        const offset = (t / loopSeconds) * pitch
        const x = direction < 0 ? -pitch - stagger - offset : -2 * pitch - stagger + offset
        row.style.transform = `translate3d(${x}px,0,0)`
      }
      // Offset so frame 0 (the default poster frame) shows a settled outing.
      const groupTime = (t + 1.5) % loopSeconds
      groups.forEach((group, index) => {
        let local = groupTime - index * segment
        if (local < -segment / 2) local += loopSeconds
        const out = easeIn((local - (segment - 0.5)) / 0.5)
        group.style.visibility = local < 0 || local > segment ? 'hidden' : 'visible'
        group.querySelectorAll('.shot').forEach((shot, i) => {
          const enter = ease((local - i * 0.08) / 0.6)
          shot.style.opacity = enter * (1 - out)
          shot.style.transform = `translateY(${(1 - enter) * 40 * s - out * 24 * s}px) scale(${0.94 + 0.06 * enter})`
        })
        const text = ease((local - 0.35) / 0.6) * (1 - out)
        group.querySelectorAll('.place, .meta').forEach(element => {
          element.style.opacity = text
          element.style.transform = `translateY(${(1 - text) * 14 * s}px)`
        })
      })
    }
    window.loopSeconds = loopSeconds
    window.ready = Promise.all([...document.images].map(img => img.decode())).then(() => document.fonts.ready)
    render(Number(params.get('t') ?? 0))
  </script>
</body>
</html>
