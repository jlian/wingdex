name: Commitlint

# The PR title is validated separately by semantic-pr-title.yml. This validates the
# individual commit messages in the PR, which nothing checked before.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Validate commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Need both branch tips so the PR commit range can be resolved.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          while read -r commit; do
            if git diff-tree --quiet "$commit^" "$commit"; then
              echo "Skipping empty commit $commit"
              continue
            fi
            git log -1 --format=%B "$commit" | npx commitlint --verbose
          done < <(git rev-list --reverse "$BASE_SHA..$HEAD_SHA")
