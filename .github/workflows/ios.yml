name: iOS Build & Test

on:
  workflow_dispatch:
    inputs:
      deep_audits:
        description: Include advisory image-based and Dynamic Type accessibility audits
        type: boolean
        default: false
  schedule:
    - cron: '17 10 * * *'
  pull_request:
    branches: [main, dev]
    paths:
      - 'ios/**'
      - 'openapi.yaml'
      - 'public/models/text_classifier_int8.bin'
      - 'public/priors/**'
      - 'src/lib/bird-id-local-adapter.ts'
      - 'src/lib/rarity.ts'
      - 'src/lib/taxonomy.json'
      - '.github/workflows/ios.yml'
      - '.github/workflows/ios-release.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [dev]
    paths:
      - 'ios/**'
      - 'openapi.yaml'
      - 'public/models/text_classifier_int8.bin'
      - 'public/priors/**'
      - 'src/lib/bird-id-local-adapter.ts'
      - 'src/lib/rarity.ts'
      - 'src/lib/taxonomy.json'
      - '.github/workflows/ios.yml'
      - '.github/workflows/ios-release.yml'
      - '.github/workflows/release.yml'

concurrency:
  group: ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

# GitHub's Xcode-versioned image keeps the SDK and host macOS compatible.
# It is ARM-only, preserving the isolated Apple Silicon lanes used here.

jobs:
  plan:
    name: Avoid duplicate push coverage
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.duplicate.outputs.skip }}
    steps:
      - id: duplicate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          skip=false
          if [[ "$EVENT_NAME" == push ]]; then
            count=$(gh api --method GET "repos/$GH_REPO/pulls" \
              -f "head=$REPOSITORY_OWNER:$BRANCH" -f base=main -f state=open -f per_page=1 --jq length)
            if [[ "$count" != 0 ]]; then skip=true; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  test:
    name: iOS ${{ matrix.lane }} lane
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: unit
            suite: core
            tests: -only-testing:WingDexTests
          - lane: ui-photos
            suite: core
            tests: -only-testing:WingDexUITests/BirdIdFlowUITests -only-testing:WingDexUITests/CameraSettingsUITests
          - lane: ui-outings
            suite: core
            tests: -only-testing:WingDexUITests -skip-testing:WingDexUITests/BirdIdFlowUITests -skip-testing:WingDexUITests/CameraSettingsUITests -skip-testing:WingDexUITests/OutingLocationVisualUITests
          - lane: ui-gestures
            suite: core
            tests: -only-testing:WingDexUITests/OutingLocationVisualUITests
          - lane: accessibility
            suite: accessibility
            tests: ''
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Read Xcode cache version
        id: xcode
        run: echo "version=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ios/build/DerivedData
          key: ios-tests-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/WingDex.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'ios/project.yml') }}-${{ matrix.lane }}
          restore-keys: |
            ios-tests-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/WingDex.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'ios/project.yml') }}-
            ios-tests-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.version }}-
            ios-tests-v3-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lane }}-${{ steps.xcode.outputs.version }}-
            ios-tests-v3-${{ runner.os }}-${{ runner.arch }}-accessibility-${{ steps.xcode.outputs.version }}-
      - name: Cache XcodeGen
        uses: actions/cache@v5
        with:
          path: ~/.cache/wingdex/xcodegen-2.46.0
          key: ios-xcodegen-2.46.0-${{ runner.os }}-${{ runner.arch }}
      - name: Cache generated Bird ID assets
        uses: actions/cache@v5
        with:
          path: |
            ios/WingDex/Resources/BirdID
            ios/build/generated/sync-birdid-assets.stamp
          key: ios-bird-id-v1-${{ hashFiles('ios/scripts/sync-birdid-assets.sh', 'public/models/text_classifier_int8.bin', 'public/priors/occurrence.*.bin.gz', 'public/priors/rarity.*.bin.gz', 'src/lib/bird-id-local-adapter.ts', 'src/lib/rarity.ts', 'src/lib/taxonomy.json', 'ios/WingDex/Resources/taxonomy.json') }}
      - name: Install XcodeGen
        run: ios/scripts/install-xcodegen.sh
      - name: Run tests
        run: make -C ios "${{ matrix.suite }}" TESTS="${{ matrix.tests }}"
      - name: Upload lane diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: iOS-${{ matrix.lane }}-diagnostics
          path: ios/build/test-results
          retention-days: 7

  deep-accessibility:
    name: Deep accessibility (advisory)
    if: github.event_name == 'schedule' || inputs.deep_audits
    runs-on: xcode-27
    timeout-minutes: 15
    # Simulator screenshot/contrast and font-resizing audits are useful reports,
    # not a reliable merge gate. Real issues and infrastructure errors stay in
    # the failing test results; neither is rewritten into a pass or skipped test.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Install XcodeGen
        run: ios/scripts/install-xcodegen.sh
      - name: Run deep audits
        run: make -C ios accessibility-deep
      - name: Upload audit diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: iOS-deep-accessibility-diagnostics
          path: ios/build/test-results
          retention-days: 7

  build-and-test:
    name: Build & Test (iOS Simulator)
    if: always()
    needs: [plan, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required iOS lanes
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          TEST_RESULT: ${{ needs.test.result }}
          SKIP_DUPLICATE_PUSH: ${{ needs.plan.outputs.skip }}
        run: |
          test "$PLAN_RESULT" = success
          [[ "$SKIP_DUPLICATE_PUSH" == true || "$TEST_RESULT" == success ]]
