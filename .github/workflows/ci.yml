name: CI & Preview

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.vscode/**'

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint & types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: node-modules-node24-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - run: npm run check:static

  unit:
    name: Unit & component tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-node24-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - run: npm test

  browser:
    name: Browser journeys (${{ matrix.shard }}/5)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: node-modules-node24-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Cache Chromium
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ runner.arch }}-

      # The pinned GitHub image already has Chromium's shared libraries and
      # Latin/emoji fonts. --with-deps spends ~20s reinstalling extra font sets.
      - name: Install Chromium
        run: npx playwright install --only-shell chromium

      - name: Build and test browser journeys
        # Each shard owns its Worker/D1 on a separate VM. Increasing workers
        # inside one process would bring back shared-runtime contention.
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/5

      - name: Upload browser failures
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: web-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

      - name: Keep tested preview build
        if: matrix.shard == 1
        uses: actions/upload-artifact@v6
        with:
          name: web-preview-build
          path: |
            dist/
            .wrangler/deploy/
          include-hidden-files: true
          retention-days: 1

  build-and-test:
    name: Verify & Deploy Preview
    needs: [checks, unit, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      deployments: write
    steps:
      - name: Require every verification lane
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$CHECKS_RESULT" = success && test "$UNIT_RESULT" = success && test "$BROWSER_RESULT" = success

      - name: Detect Cloudflare credentials
        id: cloudflare
        # Forks still execute every verification lane, but cannot deploy.
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: actions/checkout@v6
        if: steps.cloudflare.outputs.available == 'true'
        with:
          # Root manifests/config plus migrations; deploy the tested artifact,
          # not another checkout of the model assets or application sources.
          sparse-checkout: migrations

      - uses: actions/setup-node@v6
        if: steps.cloudflare.outputs.available == 'true'
        with:
          node-version: 24

      - name: Cache node_modules
        if: steps.cloudflare.outputs.available == 'true'
        id: node-modules-cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: node-modules-node24-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cloudflare.outputs.available == 'true' && steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Restore tested preview build
        if: steps.cloudflare.outputs.available == 'true'
        uses: actions/download-artifact@v8
        with:
          name: web-preview-build

      - name: Apply D1 migrations to preview DB
        if: >-
          github.head_ref != 'dev' && github.head_ref != 'main'
          && steps.cloudflare.outputs.available == 'true'
        run: printf 'y\n' | npx wrangler d1 migrations apply wingdex-db-dev --remote --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Skip deploy when the release workflow already handles this branch.
      # Use per-PR aliased preview URLs so concurrent PRs don't overwrite each
      # other. `wrangler versions upload --preview-alias pr-<N>` creates a
      # version with a stable alias URL of the form
      #   pr-<N>-wingdex-app-preview.<subdomain>.workers.dev
      # (requires preview_urls = true in wrangler.toml). Unlike `deploy`, this
      # does NOT change the live deployed version; each PR only gets its own
      # isolated preview URL.
      - name: Deploy preview to Cloudflare Workers
        if: >-
          github.head_ref != 'dev' && github.head_ref != 'main'
          && steps.cloudflare.outputs.available == 'true'
        id: deploy_preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --env preview --preview-alias pr-${{ github.event.pull_request.number }}

      - name: Branch preview deployment
        if: >-
          github.head_ref != 'dev' && github.head_ref != 'main'
          && steps.cloudflare.outputs.available == 'true'
        uses: actions/github-script@v9
        env:
          # Prefer the alias URL wrangler actually printed (robust to subdomain
          # changes); fall back to the deterministic constructed URL. The URL is
          # surfaced on the PR via the GitHub deployment/Environments UI.
          COMMAND_OUTPUT: ${{ steps.deploy_preview.outputs['command-output'] || '' }}
          FALLBACK_ALIAS_URL: https://pr-${{ github.event.pull_request.number }}-wingdex-app-preview.lianguanlun.workers.dev
        with:
          script: |
            const out = process.env.COMMAND_OUTPUT || '';
            // wrangler prints e.g. "Version Preview URL: https://pr-259-...workers.dev"
            const m = out.match(/https:\/\/pr-[a-z0-9-]+-wingdex-app-preview\.[a-z0-9-]+\.workers\.dev/i);
            const previewUrl = (m && m[0]) || process.env.FALLBACK_ALIAS_URL;
            const { data: deployment } = await github.rest.repos.createDeployment({
              ...context.repo,
              ref: '${{ github.event.pull_request.head.sha }}',
              environment: 'preview (#${{ github.event.pull_request.number }})',
              auto_merge: false,
              required_contexts: [],
              production_environment: false,
            });
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: deployment.id,
              state: 'success',
              environment_url: previewUrl || undefined,
            });

      - name: Report workflow runtime
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: context.runId,
            });
            const elapsed = Math.ceil((Date.now() - Date.parse(run.run_started_at)) / 1000);
            await core.summary
              .addRaw(`Web workflow: ${elapsed}s through deployment, including queueing and setup; remaining job cleanup is excluded. Target: under 120s.`)
              .write();
            if (elapsed >= 120) core.warning(`Web workflow exceeded the 120s target (${elapsed}s).`);
