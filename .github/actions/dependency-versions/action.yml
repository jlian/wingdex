name: Dependency cache versions
description: Keep application releases from invalidating unchanged dependencies
outputs:
  dependencies:
    value: ${{ steps.versions.outputs.dependencies }}
    description: Manifest and lockfile digest excluding the root application version
  playwright:
    value: ${{ steps.versions.outputs.playwright }}
    description: Installed Playwright Core version from the lockfile
runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      run: |
        node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
        import { readFileSync } from 'node:fs'
        import { createHash } from 'node:crypto'
        const manifest = JSON.parse(readFileSync('package.json', 'utf8'))
        const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'))
        const playwright = lock.packages['node_modules/playwright-core'].version
        delete manifest.version
        delete lock.version
        delete lock.packages[''].version
        const dependencies = createHash('sha256').update(JSON.stringify({ manifest, lock })).digest('hex')
        console.log(`dependencies=${dependencies}`)
        console.log(`playwright=${playwright}`)
        NODE
