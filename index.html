    <script type="application/ld+json">{"@context":"https://schema.org","@type":"SoftwareApplication","name":"WingDex","url":"https://wingdex.app/","description":"Free on-device bird photo identification, batch outing organization, and connected bird life list tracking for web and iPhone.","applicationCategory":"LifestyleApplication","operatingSystem":"Web, iOS","installUrl":"https://apps.apple.com/app/id6760330119","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"featureList":["Batch bird photo identification","Review suggestions for more than 10,000 bird species","Connected outings and bird life list","On-device identification, offline after model download","eBird CSV import and export with an account"]}</script>
        <script>
            document.documentElement.dataset.booting = 'true';
            (() => {
                try {
                    const stored = localStorage.getItem('theme')
                    const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
                    const theme = stored === 'dark' || stored === 'light'
                        ? stored
                        : (systemDark ? 'dark' : 'light')

                    document.documentElement.classList.remove('light', 'dark')
                    document.documentElement.classList.add(theme)
                    document.documentElement.style.colorScheme = theme

                    // Sync theme-color meta with resolved theme (#17)
                    const meta = document.querySelector('meta[name="theme-color"]')
                    if (meta) meta.setAttribute('content', theme === 'dark' ? '#262e29' : '#e5ddd0')
                } catch {
                    // no-op: fall back to default rendering
                }
            })()
        </script>
